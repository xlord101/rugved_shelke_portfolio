<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1000" fill="#080A0E"/>
  <defs>
    <radialGradient id="s-glow" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#080A0E" stop-opacity="1"/>
    </radialGradient>
    <pattern id="s-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#s-glow)"/>
  <rect width="1600" height="1000" fill="url(#s-grid)"/>

  <g transform="translate(140, 140)">
    <rect width="1320" height="720" rx="32" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Badge -->
    <rect x="60" y="60" width="260" height="42" rx="21" fill="rgba(59,130,246,0.12)" stroke="#3B82F6" stroke-opacity="0.4"/>
    <text x="190" y="86" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1.5">ENTERPRISE SUPPLY CHAIN</text>

    <text x="60" y="210" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="600" letter-spacing="-2">Startrek ERP</text>
    <text x="60" y="270" fill="rgba(255,255,255,0.6)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">Production Export Management &amp; Concurrency-Safe Dispatch</text>

    <!-- Schema Diagram -->
    <g transform="translate(60, 360)">
      <rect width="1200" height="260" rx="20" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.05)"/>
      <text x="40" y="50" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="13" letter-spacing="2">DATA ARCHITECTURE // POSTGRESQL + TRANSACTIONAL DISPATCH ENGINE</text>

      <g transform="translate(40, 80)">
        <!-- Col 1 -->
        <rect x="0" y="20" width="250" height="120" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
        <text x="24" y="54" fill="#3B82F6" font-family="monospace" font-size="14" font-weight="bold">6 USER ROLES</text>
        <text x="24" y="82" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13">RBAC Access Control</text>
        <text x="24" y="104" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="12">Audited State Machine</text>

        <!-- Arrow -->
        <path d="M 270 80 L 310 80" stroke="#3B82F6" stroke-width="2"/>

        <!-- Col 2 -->
        <rect x="330" y="20" width="280" height="120" rx="14" fill="rgba(59,130,246,0.08)" stroke="#3B82F6" stroke-opacity="0.3"/>
        <text x="354" y="54" fill="#60A5FA" font-family="monospace" font-size="14" font-weight="bold">CONCURRENCY LOCK</text>
        <text x="354" y="82" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13">Strict Stock Deduction</text>
        <text x="354" y="104" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="12">Zero Double-Dispatch</text>

        <!-- Arrow -->
        <path d="M 630 80 L 670 80" stroke="#3B82F6" stroke-width="2"/>

        <!-- Col 3 -->
        <rect x="690" y="20" width="280" height="120" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
        <text x="714" y="54" fill="#10B981" font-family="monospace" font-size="14" font-weight="bold">AUTOMATED TESTS</text>
        <text x="714" y="82" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="13">Room Capacity Math</text>
        <text x="714" y="104" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="12">Bundle Weight Bounds</text>
      </g>
    </g>
  </g>
</svg>