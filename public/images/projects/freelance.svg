<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1000" fill="#090B0E"/>
  <defs>
    <radialGradient id="f-glow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#0E1B1E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#090B0E" stop-opacity="1"/>
    </radialGradient>
    <pattern id="f-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#f-glow)"/>
  <rect width="1600" height="1000" fill="url(#f-grid)"/>

  <g transform="translate(140, 140)">
    <rect width="1320" height="720" rx="32" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Badge -->
    <rect x="60" y="60" width="240" height="42" rx="21" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="180" y="86" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1.5">CLIENT DELIVERIES</text>

    <text x="60" y="210" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="600" letter-spacing="-2">Freelance Web Development</text>
    <text x="60" y="270" fill="rgba(255,255,255,0.6)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">Production Web Solutions for KD Export, House of 666 &amp; Rojekar Brothers</text>

    <!-- 3 Client Project Cards -->
    <g transform="translate(60, 360)">
      <rect width="1200" height="260" rx="20" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.05)"/>
      <text x="40" y="50" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="13" letter-spacing="2">DELIVERED CLIENT CLIENTS // SPECIFICATION TO DEPLOYMENT</text>

      <g transform="translate(40, 80)">
        <rect x="0" y="20" width="340" height="120" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
        <text x="24" y="54" fill="#10B981" font-family="monospace" font-size="14" font-weight="bold">KD EXPORT</text>
        <text x="24" y="80" fill="rgba(255,255,255,0.8)" font-family="-apple-system, sans-serif" font-size="14">Corporate Export Portal</text>
        <text x="24" y="102" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="12">Next.js · Modern Responsive</text>

        <rect x="380" y="20" width="340" height="120" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
        <text x="404" y="54" fill="#F59E0B" font-family="monospace" font-size="14" font-weight="bold">HOUSE OF 666</text>
        <text x="404" y="80" fill="rgba(255,255,255,0.8)" font-family="-apple-system, sans-serif" font-size="14">Restaurant &amp; Cafe Showcase</text>
        <text x="404" y="102" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="12">Atmospheric Branding &amp; Menu</text>

        <rect x="760" y="20" width="340" height="120" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
        <text x="784" y="54" fill="#3B82F6" font-family="monospace" font-size="14" font-weight="bold">ROJEKAR BROTHERS</text>
        <text x="784" y="80" fill="rgba(255,255,255,0.8)" font-family="-apple-system, sans-serif" font-size="14">Digital Product Catalogue</text>
        <text x="784" y="102" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="12">Structured Industrial Showcase</text>
      </g>
    </g>
  </g>
</svg>