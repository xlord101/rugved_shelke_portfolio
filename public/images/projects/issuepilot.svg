<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1000" fill="#0A0910"/>
  <defs>
    <radialGradient id="i-glow" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#1E1333" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0A0910" stop-opacity="1"/>
    </radialGradient>
    <pattern id="i-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#i-glow)"/>
  <rect width="1600" height="1000" fill="url(#i-grid)"/>

  <g transform="translate(140, 140)">
    <rect width="1320" height="720" rx="32" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Badge -->
    <rect x="60" y="60" width="250" height="42" rx="21" fill="rgba(139,92,246,0.12)" stroke="#8B5CF6" stroke-opacity="0.4"/>
    <text x="185" y="86" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1.5">AI AGENTIC PIPELINE</text>

    <text x="60" y="210" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="600" letter-spacing="-2">Hermes → IssuePilot</text>
    <text x="60" y="270" fill="rgba(255,255,255,0.6)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">Deterministic Issue Recommendation with Pre-Delivery Verification</text>

    <!-- Schema Diagram -->
    <g transform="translate(60, 360)">
      <rect width="1200" height="260" rx="20" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.05)"/>
      <text x="40" y="50" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="13" letter-spacing="2">PIPELINE FLOW // REPO INGESTION → LLM RANKING → VERIFICATION GATE</text>

      <g transform="translate(40, 80)">
        <rect x="0" y="20" width="220" height="110" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
        <text x="24" y="52" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="12">STAGE 01</text>
        <text x="24" y="78" fill="#FFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">GitHub API Stream</text>
        <text x="24" y="100" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="12">Issue &amp; PR Activity</text>

        <path d="M 235 75 L 265 75" stroke="#8B5CF6" stroke-width="2"/>

        <rect x="280" y="20" width="240" height="110" rx="14" fill="rgba(139,92,246,0.1)" stroke="#8B5CF6" stroke-opacity="0.3"/>
        <text x="304" y="52" fill="#C4B5FD" font-family="monospace" font-size="12">STAGE 02</text>
        <text x="304" y="78" fill="#FFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">LLM Semantic Score</text>
        <text x="304" y="100" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="12">Context Complexity Eval</text>

        <path d="M 535 75 L 565 75" stroke="#8B5CF6" stroke-width="2"/>

        <rect x="580" y="20" width="280" height="110" rx="14" fill="rgba(16,185,129,0.1)" stroke="#10B981" stroke-opacity="0.4"/>
        <text x="604" y="52" fill="#6EE7B7" font-family="monospace" font-size="12">STAGE 03 · VERIFICATION GATE</text>
        <text x="604" y="78" fill="#FFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Freshness &amp; Merge Check</text>
        <text x="604" y="100" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="12">Eliminate stale / assigned claims</text>
      </g>
    </g>
  </g>
</svg>